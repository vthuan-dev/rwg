# Profile "docker" cho rwg-admin-app (chạy trong docker compose, dùng chung MySQL/Redis với user-app).
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:rwg}?rewriteBatchedStatements=true}
    username: ${DB_USER:rwg_app}
    password: ${DB_PASSWORD}
  data:
    redis:
      url: redis://${REDIS_HOST:redis}:${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

rwg:
  security:
    jwt-secret: ${JWT_SECRET}
