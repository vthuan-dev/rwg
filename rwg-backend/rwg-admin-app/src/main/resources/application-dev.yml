# Profile "dev" cho rwg-admin-app - chạy LOCAL, dùng CHUNG MySQL với user-app.
# ⚠ Mật khẩu/secret default CHỈ dành cho DEV LOCAL. Môi trường khác BẮT BUỘC set env.
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:rwg_dev}?rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1001}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

rwg:
  security:
    jwt-secret: dev-only-rwg-jwt-secret-change-me-0123456789abcdef
  crypto:
    bank-enc-key: dev-only-rwg-bank-enc-key-CHANGE-ME-do-not-use-in-prod-0123456789
  payment:
    provider: stub
    success-delay: PT1S
    callback-secret: dev-only-rwg-payment-callback-secret-CHANGE-ME-0123456789
  cors:
    # Frontend dev chạy ở cổng 3000, backend quản trị ở 8081 -> khác origin, nên
    # BẮT BUỘC khai báo ở đây, không thì trình duyệt chặn ngay bước preflight.
    allowed-origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
  websocket:
    allowed-origin-patterns:
      - "*"
  redis:
    # BẬT ở dev vì CHAT HỖ TRỢ CẦN Redis. Xem chú thích đầy đủ ở
    # rwg-user-app/src/main/resources/application-dev.yml.
    #
    # PHẢI GIỐNG giá trị của user-app: bật một bên thì bên đó publish vào Redis nhưng
    # bên kia không có listener, và không ai nhận được gì — y như tắt cả hai.
    enabled: ${RWG_REDIS_ENABLED:true}

management:
  health:
    redis:
      enabled: ${RWG_REDIS_HEALTH_ENABLED:true}

logging:
  level:
    com.rwg: debug
    org.flywaydb: info
