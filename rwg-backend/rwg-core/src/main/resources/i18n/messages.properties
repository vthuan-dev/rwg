# =============================================================================
# RWG i18n — default bundle = English (en).
# Key convention:
#   error.<ErrorCode.name()>       -> message chuẩn của ErrorCode
#   validation.<dto>.<field>.<kind> -> message validation (@NotBlank/@Size/...)
# Giữ file này ĐỒNG BỘ key tuyệt đối với messages_vi/zh/ja (MessageSourceParityTest).
# =============================================================================

