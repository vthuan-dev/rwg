# =============================================================================
# Profile "dev" - chạy LOCAL KHÔNG cần Docker:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Yêu cầu: MySQL 8.x local (xem docs/DEV-SETUP.md). Redis là OPTIONAL.
#
# ⚠ MẬT KHẨU DB: default "1001" bên dưới CHỈ dành cho DEV LOCAL của máy cá nhân.
#   - Mọi môi trường khác (staging/production) BẮT BUỘC override qua biến môi
#     trường DB_PASSWORD. KHÔNG bao giờ dùng mật khẩu này cho môi trường thật.
#   - Nếu user MySQL local của bạn khác: đặt $env:DB_USER / $env:DB_PASSWORD
#     trước khi chạy, hoặc sửa default tại đây (KHÔNG commit secret thật).
# =============================================================================
spring:
  datasource:
    # rewriteBatchedStatements=true (Phase c): gộp multi-row INSERT ledger / batch UPDATE bets
    # của settlement thành 1 round-trip MySQL. Chỉ profile MySQL - KHÔNG đụng H2 của test.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:rwg_dev}?rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1001}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

rwg:
  security:
    # Default JWT secret CHỈ dành cho DEV (base không có default -> dev phải khai báo rõ ở đây).
    # Môi trường khác bắt buộc set biến môi trường JWT_SECRET.
    jwt-secret: dev-only-rwg-jwt-secret-change-me-0123456789abcdef
  crypto:
    # Default khóa mã hóa số TK ngân hàng CHỈ dành cho DEV — CẤM DÙNG CHO MÔI TRƯỜNG THẬT.
    # Mọi môi trường khác bắt buộc set biến môi trường RWG_BANK_ENC_KEY.
    bank-enc-key: dev-only-rwg-bank-enc-key-CHANGE-ME-do-not-use-in-prod-0123456789
  payment:
    provider: stub
    success-delay: PT1S
    # Default shared-secret callback CHỈ dành cho DEV — CẤM DÙNG CHO MÔI TRƯỜNG THẬT.
    # Mọi môi trường khác bắt buộc set biến môi trường RWG_PAYMENT_CALLBACK_SECRET.
    callback-secret: dev-only-rwg-payment-callback-secret-CHANGE-ME-0123456789
  cors:
    # Frontend dev chạy ở cổng 3000, backend người chơi ở 8080 -> khác origin, nên
    # BẮT BUỘC khai báo ở đây, không thì trình duyệt chặn ngay bước preflight.
    allowed-origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
  websocket:
    # Dev cho phép mọi origin; các môi trường khác phải cấu hình danh sách cụ thể.
    allowed-origin-patterns:
      - "*"
  redis:
    # BẬT ở dev vì CHAT HỖ TRỢ CẦN Redis để hoạt động đúng.
    #
    # Broker STOMP của dự án là enableSimpleBroker — nó nằm TRONG BỘ NHỚ của từng JVM.
    # Người chơi nối WebSocket vào app này (8080), nhân sự nối vào app quản trị (8081),
    # nên hai broker không biết gì về nhau. Redis pub/sub là đường DUY NHẤT chở sự kiện
    # chat qua lại (xem ChatRelayConfig).
    #
    # Để false thì ChatRelayConfig không được tạo, ChatEventPublisher.relay() gặp
    # redis == null rồi bỏ qua IM LẶNG: tin nhắn vẫn vào MySQL đúng, nhưng phía kia
    # KHÔNG BAO GIỜ thấy tin mới cho tới khi người dùng TỰ TẢI LẠI TRANG. Không có
    # polling nào bù lại việc này — cả hai màn hình chat đều chỉ dựa vào WebSocket.
    #
    # Chưa cài Redis thì đặt RWG_REDIS_ENABLED=false: app vẫn khởi động bình thường với
    # fallback in-memory cho refresh token + rate limit, chỉ mất realtime của chat.
    # HẠN CHẾ của fallback: state KHÔNG chia sẻ giữa nhiều instance — chỉ dùng cho dev.
    #
    # PHẢI GIỐNG NHAU Ở CẢ HAI APP: bật một bên thì bên đó publish vào Redis nhưng bên
    # kia không có listener, và không ai nhận được gì — y như tắt cả hai.
    enabled: ${RWG_REDIS_ENABLED:true}

management:
  health:
    redis:
      # Theo cờ trên: bật Redis thì health check cũng nên phản ánh trạng thái thật, để
      # Redis chết hiện ra ở /actuator/health thay vì âm thầm làm chat mất realtime.
      enabled: ${RWG_REDIS_HEALTH_ENABLED:true}

logging:
  level:
    com.rwg: debug
    org.flywaydb: info
