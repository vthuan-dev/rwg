# Profile "test" cho rwg-user-app: H2 in-memory (MODE=MySQL), Flyway dùng chính bộ migration MySQL.
spring:
  datasource:
    url: jdbc:h2:mem:rwguser-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none

rwg:
  redis:
    enabled: false
  security:
    jwt-secret: test-only-rwg-jwt-secret-0123456789abcdef-9876543210
  crypto:
    bank-enc-key: test-only-rwg-bank-enc-key-0123456789abcdef
  payment:
    provider: stub
    success-delay: PT0S
    callback-secret: test-only-rwg-payment-callback-secret-0123456789
  websocket:
    allowed-origin-patterns:
      - "*"

management:
  health:
    redis:
      enabled: false

logging:
  level:
    org.hibernate.SQL: warn
